<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Slots</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131c;--card:#1f1c2a;--ink:#f1eefb;--mut:#9d98b2;--acc:#8d71ff;--line:#34304a;--lock:#ffb020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131c;--card:#1f1c2a;--ink:#f1eefb;--mut:#9d98b2;--acc:#8d71ff;--line:#34304a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:26px}p.s{margin:0 0 18px;color:var(--mut)}
.reel{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.reel.locked{border-color:var(--lock)}
.reel small{width:76px;flex:none;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.reel b{flex:1;font-size:17px;min-height:24px}
.reel.spin b{opacity:.5}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
.lk{padding:4px 8px;font-size:15px}
.reel.locked .lk{background:var(--lock);border-color:var(--lock)}
.go{width:100%;background:var(--acc);color:#fff;border:0;font-size:18px;font-weight:700;padding:14px;margin:8px 0 14px}
.go:active{transform:scale(.98)}
.pitch{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.5}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
h2{font-size:16px;margin:22px 0 8px}
.fav{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;font-size:14px;display:flex;gap:8px;justify-content:space-between}
.fav button{padding:2px 8px;height:fit-content}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.on{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:12px 0}
.chip{padding:0;overflow:hidden;display:flex;flex-direction:column;border-radius:12px;text-align:center}
.chip .pic{display:flex;align-items:center;justify-content:center;height:66px;font-size:34px}
.chip .lb{padding:6px 4px;font-size:12.5px;line-height:1.2;flex:1;display:flex;align-items:center;justify-content:center}
.chip.on{outline:3px solid var(--acc);outline-offset:-1px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}
.prim{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
.out{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;margin:10px 0}
textarea{width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.pan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;gap:8px}.pan label{display:flex;gap:8px;align-items:center}
.chips.plain{display:flex;flex-wrap:wrap}.plain .chip{flex-direction:row;border-radius:20px}.plain .lb{padding:7px 12px;font-size:14px}
.fav span{white-space:pre-wrap;max-height:110px;overflow:auto;flex:1}
</style></head><body><main><div id="gate" class="pan" style="margin-top:40px"><h1>🔒 Game Idea Lab</h1><p class="s">Enter your access code to continue.</p><input id="gi" autocomplete="off" placeholder="Access code" style="font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button class="go" id="gb" style="margin:0">Unlock</button><small id="ge" style="color:#e5484d"></small></div><div id="app" hidden>
